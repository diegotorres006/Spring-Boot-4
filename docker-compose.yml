services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups -d devdb"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/devdb
      DB_USERNAME: ups
      DB_PASSWORD: ups123
      # Esta línea va aquí adentro, indentada con los otros environment
      JWT_SECRET: EstaClaveTieneMasDe32CaracteresYEsSegura2026
    depends_on:
      db:
        condition: service_healthy